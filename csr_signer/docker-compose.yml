services:
  csr-signer:
    image: ghcr.io/filxxip/csr_signer_app:latest

    restart: unless-stopped
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    volumes:
      - ../config/mqtt-server/private/ca.key:/app/ca/ca.key:ro
      - ../config/mqtt-server/certs/ca.crt:/app/ca/ca.crt:ro
    env_file:
      - ./.env
    networks:
      - garden-net
