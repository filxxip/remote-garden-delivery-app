services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ../config/nginx/certs:/etc/nginx/certs
      - ./scripts/entrypoint.sh:/docker-entrypoint.sh:ro
      # Optional: mount HTML template if needed
      # - ./templates/index.template.html:/usr/share/nginx/html/index.template.html:ro
    networks:
      - garden-net
    env_file:
      - ./.env
      - ../.env