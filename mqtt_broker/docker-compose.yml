services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ../config/mqtt-server/mosquitto/config:/mosquitto/config
      - ../config/mqtt-server/mosquitto/certs:/mosquitto/certs
      # - ../config/mqtt-server/mosquitto/data:/mosquitto/data
      # - ../config/mqtt-server/mosquitto/log:/mosquitto/log
    env_file:
      - ./.env
    user: "${MOSQUITTO_UID}:${MOSQUITTO_GID}"
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    networks:
      - garden-net

  cert-generator:
    image: ghcr.io/filxxip/mqtt_broker_app:latest
    volumes:
      - ../config/mqtt-server:/app/mqtt-server
    restart: "no"
    env_file:
      - ./.env
      - ../.env
